  <!-- FIX #9: preload above-the-fold critical assets so browser fetches them early -->

  <link rel="preload" as="image" href="assets/brand/af_countdown_bg_mobile.png" media="(max-width: 600px)" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold:  #FFC055;
      --accent:#FFAF29;
      --red:   #EB1C24;
      --dark:  #0d0202;
      --white: #ffffff;
    }

    html, body {
      font-family: 'Kanit', sans-serif;
      color: var(--white);
      overflow-x: hidden;
    }

    body {
      min-height: 100vh;
      background-color: var(--dark);
      background-image: url('assets/brand/af_countdown_bg.png');
      background-size: cover;
      background-position: center top;
      background-repeat: no-repeat;
      /* FIX #3: removed background-attachment:fixed — it forces a full repaint on every scroll
         because the browser cannot promote it to its own compositor layer */
    }

    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.06'/%3E%3C/svg%3E");
      background-size: 180px;
      pointer-events: none; z-index: 0; opacity: 0.5;
    }

    /* ── ANIMATED LAYER ─────────────────────── */
    .anim-layer {
      position: fixed; inset: 0; z-index: 1;
      pointer-events: none; overflow: hidden;
    }
    .anim-layer::before {
      content: ''; position: absolute; inset: 0;
      background:
        radial-gradient(ellipse 90% 60% at 50% 20%, rgba(180,8,4,0.60) 0%, transparent 70%),
        radial-gradient(ellipse 60% 50% at 80% 80%, rgba(100,4,4,0.45) 0%, transparent 65%),
        linear-gradient(180deg, rgba(13,2,2,0.7) 0%, rgba(13,2,2,0.9) 100%);
    }
    .orb {
      position: absolute; border-radius: 50%; opacity: 0;
      will-change: transform, opacity;
      animation: floatUp var(--dur) var(--delay) ease-in-out infinite;
    }
    @keyframes floatUp {
      0%   { opacity: 0; transform: translateY(0) scale(0.6); }
      15%  { opacity: var(--peak); }
      80%  { opacity: calc(var(--peak) * 0.25); }
      100% { opacity: 0; transform: translateY(-110vh) scale(1.1); }
    }
    .beam {
      position: absolute; top: -10%; width: 3px; height: 65%;
      background: linear-gradient(180deg, rgba(255,200,80,0.55) 0%, rgba(255,200,80,0.10) 60%, transparent 100%);
      border-radius: 2px; filter: blur(4px);
      transform-origin: top center;
      will-change: transform, opacity;
      animation: sweep var(--sdur) var(--sdelay) ease-in-out infinite alternate;
    }
    @keyframes sweep {
      0%   { transform: rotate(var(--sa)); opacity: 0.25; }
      50%  { opacity: 0.75; }
      100% { transform: rotate(var(--sb)); opacity: 0.25; }
    }

    /* FIX #2: use transform:scale() instead of animating width/height, which triggers
       layout reflow on every frame — scale runs on the compositor thread */
    .ring {
      position: absolute; left: 50%; top: 38%;
      width: 40px; height: 40px;
      transform: translate(-50%, -50%) scale(1);
      border-radius: 50%;
      border: 1px solid rgba(255,200,80,0.14);
      will-change: transform, opacity;
      animation: expandRing var(--rdur) var(--rdelay) ease-out infinite;
    }
    @keyframes expandRing {
      0%   { transform: translate(-50%, -50%) scale(1);  opacity: 0.65; }
      100% { transform: translate(-50%, -50%) scale(20); opacity: 0; }
    }

    #dustCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    /* ── PAGE ───────────────────────────────── */
    .page {
      position: relative; z-index: 2;
      min-height: 100vh;
      display: flex; flex-direction: column; align-items: center;
      padding: 40px 24px 48px;
    }

    /* ── LOGO ───────────────────────────────── */
    .logo-wrap {
      position: relative; overflow: hidden;
      animation: fadeDown 0.9s ease both; margin-bottom: 32px;
    }
    .logo-wrap img {
      width: clamp(180px, 36vw, 320px); height: auto;
    }
    .logo-wrap::after {
      content: '';
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      background: linear-gradient(105deg, transparent 30%, rgba(255,230,120,0.75) 50%, transparent 70%);
      -webkit-mask-image: url('assets/brand/af_logo.png');
      -webkit-mask-size: contain;
      -webkit-mask-repeat: no-repeat;
      -webkit-mask-position: center;
      mask-image: url('assets/brand/af_logo.png');
      mask-size: contain;
      mask-repeat: no-repeat;
      mask-position: center;
      transform: translateX(-150%);
      animation: logoShimmer 1s 0.7s ease-out forwards;
      pointer-events: none;
    }

    /* ── TITLE ──────────────────────────────── */
    .title {
      margin-bottom: 32px;
      font-size: clamp(20px, 5vw, 44px);
      line-height: 1.2;
      font-weight: 600; letter-spacing: 0.04em;
      text-align: center; color: var(--accent);
      text-shadow: 0 2px 12px rgba(0,0,0,0.8);
    }
    .title-br { display: none; }
    @media (max-width: 600px) { .title-br { display: block; } }

    /* ── GRID ───────────────────────────────── */
    .grid-wrap {
      width: 100%; max-width: 1100px;
      animation: fadeUp 0.9s 0.3s ease both;
    }
    .contestant-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 24px;
    }
    @media (max-width: 900px)  { .contestant-grid { grid-template-columns: repeat(3, 1fr); gap: 24px; } }
    @media (max-width: 600px)  {
      .page { padding: 32px 20px 40px; }
      .logo-wrap { margin-bottom: 20px; }
      .title { font-size: clamp(28px, 8vw, 36px); line-height: 1.15; }
      .contestant-grid { grid-template-columns: repeat(2, 1fr); gap: 16px; }
      body {
        background-image: url('assets/brand/af_countdown_bg_mobile.png');
        background-position: center center;
        /* background-attachment already removed from desktop rule above */
      }
    }

    /* ════ CONTESTANT CARD ═════════════════════ */
    .contestant-card {
      position: relative;
      aspect-ratio: 3 / 4;
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
      border: none;
      background:
        radial-gradient(ellipse at 30% 80%, rgba(220,0,0,0.30) 0%, rgba(100,0,0,0.18) 35%, transparent 65%),
        radial-gradient(ellipse at 80% 20%, rgba(140,0,0,0.20) 0%, transparent 50%),
        linear-gradient(150deg,
          rgba(0,0,0,0.26) 0%,
          rgba(13,0,0,0.22) 20%,
          rgba(92,0,0,0.20) 45%,
          rgba(200,0,0,0.20) 60%,
          rgba(26,0,0,0.22) 80%,
          rgba(0,0,0,0.26) 100%),
        url('assets/brand/modal_image.png');
      background-size: auto, auto, auto, cover;
      background-position: 0 0, 0 0, 0 0, center;
      background-repeat: no-repeat;
      box-shadow:
        0 8px 32px rgba(0,0,0,0.70),
        0 0 0 1px rgba(200,0,0,0.15),
        inset 0 -2px 0 rgba(220,0,0,0.30);
      transition: transform 0.30s cubic-bezier(.17,.67,.38,1.3), box-shadow 0.30s ease;
      animation: cardReveal 0.6s calc(var(--i,0) * 75ms) ease both;
    }
    .contestant-card:hover {
      transform: scale(1.05);
      box-shadow:
        0 20px 52px rgba(0,0,0,0.80),
        0 0 45px rgba(200,0,0,0.40),
        0 0 0 1px rgba(220,0,0,0.30),
        inset 0 -2px 0 rgba(220,0,0,0.50);
    }
    @keyframes cardReveal {
      from { opacity: 0; transform: translateY(28px) scale(0.96); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* FIX #14: explicit width/height prevent layout shift (CLS) while images load */
    .contestant-card > img {
      position: absolute;
      top: 5%; left: 0; right: 0; bottom: 0;
      width: 100%; height: 95%;
      object-fit: cover; object-position: top;
      display: block;
    }

    .card-veil {
      position: absolute; inset: 0;
      background: linear-gradient(180deg,
        transparent 20%,
        rgba(0,0,0,0.15) 48%,
        rgba(0,0,0,0.72) 70%,
        rgba(0,0,0,0.97) 100%);
      pointer-events: none;
    }

    .card-info {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      z-index: 2;
      padding: 10px 12px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
    }

    .card-code {
      width: 46px; height: 46px;
      border-radius: 50%;
      background: url('assets/brand/Vx_Name.png') center/cover no-repeat;
      border: none;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Inter', sans-serif;
      font-size: 16px; font-weight: 800;
      color: #000;
      letter-spacing: 0.01em;
      flex-shrink: 0;
    }

    .card-name {
      color: var(--accent);
      font-size: 36px;
      font-weight: 500;
      line-height: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    @media (max-width: 900px) {
      .card-code { width: 36px; height: 36px; font-size: 13px; }
      .card-name  { font-size: 34px; }
    }
    @media (max-width: 600px) {
      .card-code { width: 30px; height: 30px; font-size: 12px; }
      .card-name  { font-size: 28px; }
    }

    /* ── SPONSORS ───────────────────────────── */
    .sponsor-section {
      width: 100%; max-width: 600px;
      display: flex; flex-direction: column; align-items: center;
      gap: 10px; margin-top: 52px;
      animation: fadeUp 0.9s 0.55s ease both;
    }
    .sponsor-label {
      font-size: 14px; font-weight: 300;
      letter-spacing: 0.2em; color: var(--white); text-transform: uppercase;
    }
    .sponsor-logo-wrap img {
      height: 78px; width: auto; max-width: 100%; object-fit: contain;
    }

    /* ════════════════════════════════════════
       MODAL (desktop ≥601px)
    ════════════════════════════════════════ */
    .modal-backdrop {
      display: none;
      position: fixed; inset: 0; z-index: 100;
      background: rgba(4,0,0,0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      align-items: center; justify-content: center;
      padding: 20px;
    }
    .modal-backdrop.open { display: flex; animation: backdropIn 0.22s ease; }
    @keyframes backdropIn { from { opacity:0; } to { opacity:1; } }

    .modal-box {
      position: relative;
      background:
        radial-gradient(ellipse at 0% 100%, rgba(200,0,0,0.26) 0%, rgba(90,0,0,0.15) 35%, transparent 65%),
        radial-gradient(ellipse at 100% 0%, rgba(120,0,0,0.20) 0%, rgba(50,0,0,0.10) 40%, transparent 65%),
        radial-gradient(ellipse at 50% 50%, rgba(80,0,0,0.07) 0%, transparent 70%),
        linear-gradient(150deg, rgba(0,0,0,0.18) 0%, rgba(10,0,0,0.14) 40%, rgba(0,0,0,0.20) 100%),
        url('assets/brand/modal_image.png');
      background-size: auto, auto, auto, auto, cover;
      background-position: 0 0, 0 0, 0 0, 0 0, top center;
      background-repeat: no-repeat;
      /* FIX #4: removed backdrop-filter:blur(22px) from modal-box —
         .modal-backdrop already blurs the entire backdrop; double-blurring is very
         expensive on mobile GPUs and produces no visible improvement */
      border: none;
      border-radius: 26px;
      box-shadow:
        0 50px 100px rgba(0,0,0,0.85),
        0 0 60px rgba(160,0,0,0.25),
        inset 0 1px 0 rgba(255,100,100,0.08);
      display: flex;
      max-width: 920px; width: 100%;
      height: 480px;
      overflow: hidden;
      animation: modalIn 0.34s cubic-bezier(.17,.67,.38,1.2) both;
    }
    @keyframes modalIn {
      from { opacity:0; transform:scale(0.90) translateY(16px); }
      to   { opacity:1; transform:scale(1)    translateY(0);    }
    }

    .modal-close {
      position: absolute; top: 16px; right: 16px; z-index: 10;
      width: 36px; height: 36px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 50%;
      color: var(--white); font-size: 16px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s, transform 0.2s;
    }
    .modal-close:hover { background: rgba(235,28,36,0.42); transform: scale(1.1); }

    .modal-text-col {
      flex: 0 0 45%;
      padding: 52px 32px 40px 44px;
      display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-start;
      text-align: left;
      overflow-y: auto;
    }
    .modal-header-row {
      display: flex; align-items: flex-end; gap: 12px;
      margin-bottom: 20px;
    }
    .modal-badge {
      width: 44px; height: 44px;
      border-radius: 50%;
      background: url('assets/brand/Vx_Name.png') center/cover no-repeat;
      border: none;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Inter', sans-serif; font-size: 16px; font-weight: 800;
      color: #000; letter-spacing: 0.02em;
    }
    .modal-name {
      font-size: clamp(28px, 4vw, 38px); font-weight: 700;
      color: #FFAF29; line-height: 1.1; margin: 0;
    }

    .modal-desc {
      display: flex; flex-direction: column; gap: 14px;
      text-align: left;
    }
    .modal-meta-row {
      display: flex; gap: 24px; justify-content: flex-start;
      flex-wrap: wrap;
    }
    .modal-meta-item {
      display: flex; flex-direction: column; align-items: flex-start; gap: 3px;
    }
    .meta-label {
      font-size: 11px; font-weight: 600;
      color: rgba(255,175,41,0.55);
      letter-spacing: 0.14em; text-transform: uppercase;
    }
    .meta-value {
      font-size: 20px; font-weight: 500;
      color: rgba(255,255,255,0.90);
      line-height: 1.2;
    }
    .modal-genre-row {
      display: flex; flex-direction: column; align-items: flex-start; gap: 3px;
    }
    .modal-quote {
      display: flex; flex-direction: column; align-items: flex-start; gap: 3px;
    }
    .modal-quote .meta-value {
      font-size: 20px; font-weight: 400;
      font-style: italic;
      color: rgba(255,255,255,1);
    }

    .modal-stack-col {
      flex: 0 0 55%;
      position: relative;
      overflow: hidden;
      padding-top: 32px;
    }
    .modal-stack-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top;
      display: block;
    }

    /* ════════════════════════════════════════
       BOTTOM SHEET (mobile ≤600px)
    ════════════════════════════════════════ */

    /* FIX #1a: replace display:none/block toggle with opacity+pointer-events so the
       backdrop can fade out smoothly alongside the sheet's close animation instead
       of disappearing instantly (which made the background "pop" behind the sheet) */
    .sheet-backdrop {
      position: fixed; inset: 0; z-index: 100;
      background: rgba(0,0,0,0.70);
      touch-action: none;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.24s ease;
    }
    .sheet-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .bottom-sheet {
      position: fixed; top: 10dvh; bottom: 0; left: 0; right: 0; z-index: 101;
      background:
        radial-gradient(ellipse at 50% 30%, rgba(220,0,0,0.28) 0%, rgba(100,0,0,0.18) 40%, transparent 70%),
        radial-gradient(ellipse at 10% 90%, rgba(160,0,0,0.22) 0%, transparent 50%),
        radial-gradient(ellipse at 90% 10%, rgba(120,0,0,0.17) 0%, transparent 50%),
        linear-gradient(160deg, rgba(0,0,0,0.18) 0%, rgba(10,0,0,0.14) 50%, rgba(0,0,0,0.20) 100%),
        url('assets/brand/modal_image.png');
      background-size: auto, auto, auto, auto, cover;
      background-position: 0 0, 0 0, 0 0, 0 0, top center;
      background-repeat: no-repeat;
      border-top: 1px solid rgba(200,0,0,0.20);
      border-radius: 24px 24px 0 0;
      padding-bottom: env(safe-area-inset-bottom, 24px);
      height: auto;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 0;
      transform: translateY(100%);
      visibility: hidden;
      pointer-events: none;
      will-change: transform;
    }
    .bottom-sheet.open    { transform: translateY(0); visibility: visible; pointer-events: auto; animation: sheetUp 0.28s cubic-bezier(.25,.46,.45,.94) both; }
    .bottom-sheet.closing { animation: sheetDown 0.24s ease-in both; }
    @keyframes sheetUp   { from { transform:translateY(100%); } to { transform:translateY(0); } }
    @keyframes sheetDown { from { transform:translateY(0);    } to { transform:translateY(100%); } }

    .sheet-top-bar {
      position: relative;
      z-index: 10;
      padding: 14px 16px 12px;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      cursor: grab;
      touch-action: none;
    }
    .sheet-top-bar:active { cursor: grabbing; }
    .sheet-handle {
      width: 40px; height: 4px;
      background: rgba(255,255,255,0.20);
      border-radius: 2px;
      pointer-events: none;
    }
    .sheet-close-x {
      position: absolute; top: 12px; right: 14px;
      z-index: 20;
      width: 32px; height: 32px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 50%;
      color: var(--white); font-size: 14px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s;
      touch-action: auto;
    }
    .sheet-close-x:hover { background: rgba(235,28,36,0.40); }

    .sheet-stack-wrap {
      position: relative;
      height: 45dvh;
      max-height: 340px;
      flex-shrink: 1;
      min-height: 120px;
      padding: 16px 24px 0;
      overflow: hidden;
    }
    .sheet-stack-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top;
      display: block;
      border-radius: 12px;
    }

    .sheet-body {
      flex: 1 1 0;
      min-height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      padding: 40px 24px 32px;
      display: block;
      background: #1c1c1e;
    }

    .sheet-header-row {
      display: flex; align-items: flex-end; gap: 10px;
      margin-bottom: 12px;
    }
    .sheet-badge {
      width: 34px; height: 34px;
      border-radius: 50%;
      background: url('assets/brand/Vx_Name.png') center/cover no-repeat;
      border: none; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 800;
      color: #000; letter-spacing: 0.02em;
    }
    .sheet-name {
      font-size: 26px; font-weight: 700;
      color: #FFAF29; line-height: 1.1; margin: 0;
    }

    .sheet-desc {
      display: flex; flex-direction: column; gap: 12px;
    }
    .sheet-meta-row {
      display: flex; gap: 24px; flex-wrap: wrap;
    }
    .sheet-meta-item {
      display: flex; flex-direction: column; gap: 2px;
    }
    .sheet-meta-item .meta-label  { font-size: 12px; }
    .sheet-meta-item .meta-value  { font-size: 16px; font-weight: 500; }
    .sheet-genre-row {

<script>
/* ════ ANIMATED BG ═══════════════════════ */

   {'l':'68%','a':'8deg','b':'24deg','d':'8s','dl':'2.5s'},{'l':'10%','a':'-35deg','b':'-18deg','d':'11s','dl':'0.5s'},
   {'l':'88%','a':'18deg','b':'36deg','d':'10s','dl':'3.2s'}].forEach(c=>{

    e.style.setProperty('--sdur',c.d);e.style.setProperty('--sdelay',c.dl);L.appendChild(e);
  });
  const P=['rgba(255,200,60,1)','rgba(235,28,36,1)','rgba(255,120,40,1)','rgba(255,240,180,1)','rgba(200,10,10,1)'];
  const orbCount = window.innerWidth <= 600 ? 8 : 24;

      background:${P[Math.floor(Math.random()*P.length)]};filter:blur(${7+Math.random()*16}px)`;
    e.style.setProperty('--peak',(0.22+Math.random()*0.45).toFixed(2));
    e.style.setProperty('--dur',(12+Math.random()*16)+'s');
    e.style.setProperty('--delay',(Math.random()*14)+'s');
    L.appendChild(e);
  }
})();

/* ══ GOLD DUST ══════════════════════════════════════════════════ */
(function () {
  const canvas = document.getElementById('dustCanvas');
  const ctx    = canvas.getContext('2d');

  /* FIX #13: debounce resize so it doesn't fire on every pixel during drag-resize */
  function debounce(fn, wait) {
    let t; return function() { clearTimeout(t); t = setTimeout(fn, wait); };
  }

  /* FIX #5: cache viewport width — reading window.innerWidth every rAF frame
     can trigger style recalculation; update it only on debounced resize */
  let _vpW = window.innerWidth;
  function resize() { _vpW = window.innerWidth; canvas.width = _vpW; canvas.height = window.innerHeight; }
  resize();
  window.addEventListener('resize', debounce(resize, 16));

  const COLS = [[255,215,50],[255,185,20],[255,145,10],[255,235,120],[255,200,55],[255,165,40]];

  /* FIX #6a: pre-build "R,G,B" strings once so the hot draw path avoids repeated
     string interpolation of the same values every frame */
  const COL_STRS = COLS.map(c => `${c[0]},${c[1]},${c[2]}`);

  class Dust {
    constructor(spawnX, spawnY) {
      const W = canvas.width, H = canvas.height;
      this.x = Math.max(0, Math.min(W, spawnX + (Math.random()-0.5)*W*0.55));
      this.y = Math.max(0, Math.min(H, spawnY + (Math.random()-0.5)*H*0.55));
      this.r = 0.5 + Math.pow(Math.random(), 2.5) * 2.8;
      this.cs      = COL_STRS[Math.floor(Math.random()*COL_STRS.length)];
      this.peak    = Math.random() < 0.12 ? 1.0 : 0.18 + Math.random()*0.45;
      this.vx      = (Math.random()-0.5)*0.25;
      this.vy      = -(0.06 + Math.random()*0.28);
      this.wAmp    = 0.15 + Math.random()*0.55;
      this.wFreq   = 0.5  + Math.random()*1.8;
      this.wPhase  = Math.random()*Math.PI*2;
      this.tFreq   = 2.5  + Math.random()*5.0;
      this.tPhase  = Math.random()*Math.PI*2;
      this.maxLife = 200  + Math.random()*220;
      this.life=0; this.t=0;
    }
    update() {
      this.x += this.vx + Math.sin(this.t*this.wFreq+this.wPhase)*this.wAmp;
      this.y += this.vy;
      this.life++; this.t += 0.016;
    }
    draw(ctx) {
      const p=this.life/this.maxLife;
      const env=Math.sin(Math.PI*p);
      const twinkle=0.65+0.35*Math.sin(this.t*this.tFreq+this.tPhase);
      const alpha=this.peak*env*twinkle;
      if (alpha<0.008) return;
      const hR=this.r*(this.r>1.8?8:5.5);
      const g=ctx.createRadialGradient(this.x,this.y,0,this.x,this.y,hR);
      /* FIX #6b: reuse pre-built color string; only compute alpha values (which do change) */
      const a0=alpha.toFixed(3), a1=(alpha*0.4).toFixed(3);
      g.addColorStop(0,   `rgba(${this.cs},${a0})`);
      g.addColorStop(0.25,`rgba(${this.cs},${a1})`);
      g.addColorStop(1,   `rgba(${this.cs},0)`);
      ctx.beginPath(); ctx.arc(this.x,this.y,hR,0,Math.PI*2);
      ctx.fillStyle=g; ctx.fill();
      if (this.peak>0.55 && this.r>1.2) {
        ctx.beginPath(); ctx.arc(this.x,this.y,this.r*0.45,0,Math.PI*2);
        ctx.fillStyle=`rgba(255,245,190,${(alpha*0.9).toFixed(3)})`; ctx.fill();
      }
    }
    isDead() { return this.life>=this.maxLife; }
  }

  const particles=[];
  let mode='idle', frameCounter=0, pauseFrames=30, activeDur=0;
  let sweepX=0, sweepY=0, sweepDX=0, sweepDY=0;
  function startWave() {
    mode='active'; frameCounter=0;
    activeDur=90+Math.floor(Math.random()*70);
    const dirs=[
      {x0:0,               y0:canvas.height*0.5, dx:3.5,  dy:0  },
      {x0:canvas.width,    y0:canvas.height*0.5, dx:-3.5, dy:0  },
      {x0:0,               y0:canvas.height*0.2, dx:3.0,  dy:1.5},
      {x0:canvas.width,    y0:canvas.height*0.3, dx:-3.0, dy:1.5},
      {x0:canvas.width*0.5,y0:0,                 dx:1.0,  dy:3.0},
    ];
    const d=dirs[Math.floor(Math.random()*dirs.length)];
    sweepX=d.x0; sweepY=d.y0; sweepDX=d.dx; sweepDY=d.dy;
  }
  function startPause() { mode='idle'; frameCounter=0; pauseFrames=180+Math.floor(Math.random()*180); }
  startPause(); pauseFrames=30;

  function frame() {
    requestAnimationFrame(frame);
    ctx.clearRect(0,0,canvas.width,canvas.height);
    frameCounter++;
    if (mode==='idle') { if (frameCounter>=pauseFrames) startWave(); }
    else {
      sweepX+=sweepDX; sweepY+=sweepDY;
      /* FIX #5: use cached _vpW instead of reading window.innerWidth every frame */
      const n = _vpW <= 600 ? 1+Math.floor(Math.random()*2) : 4+Math.floor(Math.random()*5);
      for (let i=0;i<n;i++) particles.push(new Dust(sweepX,sweepY));
      if (frameCounter>=activeDur) startPause();
    }
    /* FIX #11: swap-and-pop instead of splice — avoids O(n) array element shifting
       on every dead particle removal; swap with last element then pop is O(1) */
    let i = 0;
    while (i < particles.length) {
      const p = particles[i];
      p.update(); p.draw(ctx);
      if (p.isDead()) {
        particles[i] = particles[particles.length - 1];
        particles.pop();
      } else {
        i++;
      }
    }
  }
  requestAnimationFrame(frame);
})();

/* FIX #12: cache all DOM refs once at startup instead of querying on every interaction */
const $sheet         = document.getElementById('bottomSheet');
const $sheetBackdrop = document.getElementById('sheetBackdrop');
const $modalBackdrop = document.getElementById('modalBackdrop');

let _savedScrollY = 0;
function lockBodyScroll() {
  _savedScrollY = window.scrollY;
  document.body.style.position = 'fixed';
  document.body.style.top = '-' + _savedScrollY + 'px';
  document.body.style.width = '100%';
}
function unlockBodyScroll() {
  document.body.style.position = '';
  document.body.style.top = '';
  document.body.style.width = '';
  window.scrollTo(0, _savedScrollY);
}

function openProfile(card) {
  const code   = card.dataset.code;
  /* FIX #10 guard: CONTESTANTS may not yet be available on very slow connections
     because contestants.js is deferred; fall back to empty object gracefully */
  const p      = (typeof CONTESTANTS !== 'undefined' && CONTESTANTS[code]) || {};
  const name   = p.name || card.dataset.name;
  const imgSrc = 'assets/contestants/' + code + '.png';

  if (isMobile()) {
    $sheetBadge.textContent  = code;
    $sheetName.textContent   = name;
    $sheetAge.textContent    = p.age    || '—';
    $sheetHeight.textContent = p.height || '—';
    $sheetHome.textContent   = p.home   || '—';
    $sheetGenre.textContent  = p.genre  || '—';
    $sheetQuote.textContent  = p.quote ? `"${p.quote}"` : '—';
    $sheetImg.src = imgSrc; $sheetImg.alt = name;
    $sheetBackdrop.classList.add('open');
    $sheet.classList.add('open');
    lockBodyScroll();
  } else {
    $modalBadge.textContent  = code;
    $modalName.textContent   = name;
    $modalAge.textContent    = p.age    || '—';
    $modalHeight.textContent = p.height || '—';
    $modalHome.textContent   = p.home   || '—';
    $modalGenre.textContent  = p.genre  || '—';
    $modalQuote.textContent  = p.quote ? `"${p.quote}"` : '—';
    $modalImg.src = imgSrc; $modalImg.alt = name;
    $modalBackdrop.classList.add('open');
    lockBodyScroll();
  }
}

function handleBackdropClick(e) {
  if (e.target === $modalBackdrop) closeAll();
}

/* FIX #1b: Reworked closeAll to eliminate the mobile flash.
   Root causes fixed:
   1. Inline style reset was unconditional at the top — caused a 1-frame snap
      back to the open position before the closing animation could start.
   2. Backdrop was removed immediately — the dark overlay disappeared while
      the sheet was still visible, making the background "pop" behind it.
   Fix: only reset inline styles in the skipAnim branch (after drag is done);
   let the CSS opacity transition on .sheet-backdrop fade it out alongside
   the sheetDown animation; clean up inline styles only after animationend. */
function closeAll(skipAnim) {
  $modalBackdrop.classList.remove('open');

  if (skipAnim || !$sheet.classList.contains('open')) {
    $sheet.style.transform  = '';
    $sheet.style.transition = '';
    $sheetBackdrop.classList.remove('open');
    $sheet.classList.remove('open', 'closing');
    unlockBodyScroll();
    return;
  }

  /* Removing .open triggers the CSS opacity transition on the backdrop (0.24s),
     which matches the sheet's sheetDown animation (0.24s) — they fade together */
  $sheetBackdrop.classList.remove('open');
  $sheet.classList.add('closing');
  $sheet.addEventListener('animationend', function handler() {
    $sheet.classList.remove('open', 'closing');
    $sheet.style.transform  = '';
    $sheet.style.transition = '';
    unlockBodyScroll();
  }, { once: true });
}

/* ── DRAG-TO-CLOSE (bottom sheet) ───────── */
(function () {
  const topBar   = $sheet.querySelector('.sheet-top-bar');
  const closeBtn = $sheet.querySelector('.sheet-close-x');
  const DISMISS_THRESHOLD = 80;
  let startY = 0, currentY = 0, dragging = false;

  function dragStart(clientY) {
    startY = clientY;
    currentY = clientY;
    dragging = true;
    $sheet.style.transition = 'none';
  }
  function dragMove(clientY) {
    if (!dragging) return;
    currentY = clientY;
    const dy = Math.max(0, currentY - startY);
    $sheet.style.transform = `translateY(${dy}px)`;
  }
  function dragEnd(clientY) {
    if (!dragging) return;
    dragging = false;
    const dy = Math.max(0, clientY - startY);
    if (dy > DISMISS_THRESHOLD) {
      $sheet.style.transition = 'transform 0.25s ease';
      $sheet.style.transform  = 'translateY(100%)';
      setTimeout(() => closeAll(true), 250);
    } else {
      $sheet.style.transition = 'transform 0.25s cubic-bezier(.17,.67,.38,1.1)';
      $sheet.style.transform  = '';
    }
  }

  /* Touch */
  topBar.addEventListener('touchstart', e => dragStart(e.touches[0].clientY), { passive: true });
  topBar.addEventListener('touchmove',  e => dragMove(e.touches[0].clientY),  { passive: true });
  topBar.addEventListener('touchend',   e => dragEnd(e.changedTouches[0].clientY));

  /* Mouse (desktop testing) */
  topBar.addEventListener('mousedown', e => dragStart(e.clientY));
  window.addEventListener('mousemove', e => { if (dragging) dragMove(e.clientY); });
  window.addEventListener('mouseup',   e => { if (dragging) dragEnd(e.clientY); });

  /* Stop drag from firing when the close button is tapped/clicked */
  closeBtn.addEventListener('touchstart', e => e.stopPropagation(), { passive: true });
  closeBtn.addEventListener('mousedown',  e => e.stopPropagation());
})();

document.addEventListener('keydown', e => { if (e.key==='Escape') closeAll(); });
</script>
</body>
</html>
